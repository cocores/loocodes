name: LooCodes
options:
  bundleIdPrefix: com.cocores
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  LooCodes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LooCodes
        excludes:
          - Info.plist
    info:
      path: LooCodes/Info.plist
      properties:
        CFBundleDisplayName: LooCodes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          LooCodes uses your location to show nearby bathrooms and sort
          listings by distance.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocores.loocodes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseFirestore
