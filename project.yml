name: LooCodes
options:
  bundleIdPrefix: com.cocores
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  LooCodes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LooCodes
        excludes:
          - Info.plist
    info:
      path: LooCodes/Info.plist
      properties:
        CFBundleDisplayName: LooCodes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: >-
          LooCodes uses your location to show nearby bathrooms and sort
          listings by distance.
        # The reversed iOS client ID from GoogleService-Info.plist's
        # REVERSED_CLIENT_ID — this is what lets Google's sign-in flow hand
        # control back to this app after the user authenticates in the
        # system browser. GIDClientID is the (non-reversed) CLIENT_ID.
        GIDClientID: 886081277831-4t8mgua0mvj908jn1cj0mjjoththi09i.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.886081277831-4t8mgua0mvj908jn1cj0mjjoththi09i
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocores.loocodes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: LooCodes/LooCodes.entitlements
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - package: GoogleSignIn-iOS
        product: GoogleSignInSwift
